<div id="westbund-composition">
  <style>
    #westbund-composition { color: var(--foreground); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #westbund-composition .view-controls { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
    #westbund-composition .view-controls button { cursor:pointer; }
    #westbund-composition .screen-names { display:grid; grid-template-columns:repeat(3,1fr); margin-bottom:7px; color:var(--muted-foreground); text-align:center; font-size:12px; }
    #westbund-composition .composition { display:block; width:100%; height:auto; background:#fff; }
    #westbund-composition .screen-art { color:#20201e; }
    #westbund-composition .key { display:flex; flex-wrap:wrap; gap:12px 28px; margin-top:14px; font-size:12px; color:var(--foreground); }
    #westbund-composition .key span { display:flex; align-items:center; gap:7px; }
    #westbund-composition .key i { width:5px; height:5px; background:currentColor; display:inline-block; border-radius:50%; }
    #westbund-composition .physical { position:relative; height:72px; color:var(--muted-foreground); }
    #westbund-composition .book-point { position:absolute; left:27.5%; top:7px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:5px; font-size:11px; white-space:nowrap; }
    #westbund-composition .book-point svg { width:30px; height:27px; }
    #westbund-composition [hidden] { display:none!important; }
    @media(max-width:420px) {
      #westbund-composition .view-controls { gap:4px; }
      #westbund-composition .key { gap:7px 16px; }
    }

  <script>
    (() => {
      const root = document.getElementById("westbund-composition");
      const stage = root.querySelector(".composition");
      const names = root.querySelector(".screen-names");
      const physical = root.querySelector(".physical");
      const status = root.querySelector("#wb-view-status");
      const views = {
        all: "0 0 2880 540",
        left: "0 0 960 540",
        middle: "960 0 960 540",
        right: "1920 0 960 540"
      };
      root.querySelectorAll("[data-view]").forEach(button => {
        button.addEventListener("click", () => {
          root.querySelectorAll("[data-view]").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
          stage.setAttribute("viewBox", views[button.dataset.view]);
          names.hidden = button.dataset.view !== "all";
          physical.hidden = button.dataset.view !== "all";
          status.textContent = "当前查看" + button.textContent + "。";
        });
      });
    })();
  </script>
