  <script>
    (() => {
      const root=document.getElementById("westbund-v9");
      const svg=root.querySelector(".wb-canvas");
      const intro=root.querySelector('[data-art="intro"]');
      const reading=root.querySelector('[data-art="reading"]');
      const audience=root.querySelector('[data-art="audience"]');
      const seams=root.querySelector(".wb-seams");
      const caption=root.querySelector(".wb-caption");
      const labels={intro:"Opening",reading:"Journal",audience:"Presence"};
      const views={all:"0 0 2880 540",left:"0 0 960 540",middle:"960 0 960 540",right:"1920 0 960 540"};
      const setHidden=(node,value)=>node.toggleAttribute("hidden",value);
      root.querySelectorAll("[data-scene]").forEach(button=>{
        button.addEventListener("click",()=>{
          const scene=button.dataset.scene;
          root.querySelectorAll("[data-scene]").forEach(other=>other.setAttribute("aria-pressed",String(other===button)));
          setHidden(intro,scene!=="intro");
          setHidden(reading,scene==="intro");
          setHidden(audience,scene!=="audience");
          seams.setAttribute("stroke",scene==="intro"?"#fff":"#000");
          caption.textContent=labels[scene]+" · Static keyframe";
        });
      });
      root.querySelector("select").addEventListener("change",event=>{
        const view=event.target.value;
        svg.setAttribute("viewBox",views[view]);
        root.querySelector(".wb-screens").hidden=view!=="all";
        root.querySelector(".wb-physical").hidden=view!=="all";
      });
    })();
  </script>
