.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #westbund-book-guide { color:light-dark(#252525,#e4e4e4); font-family:&quot;Westbund Grotesque&quot;,Arial,sans-serif; position:relative; padding:48px 0; }
    #westbund-book-guide * { box-sizing:border-box; }
    #westbund-book-guide [hidden] { display:none!important; }
    #westbund-book-guide .wb-stage { position:relative; }
    #westbund-book-guide .wb-canvas { display:block; width:100%; height:auto; background:#fff; }
    #westbund-book-guide .wb-canvas text { font-family:Arial,sans-serif; font-weight:400; }
    #westbund-book-guide .wb-canvas .wb-serif { font-family:Georgia,&quot;Times New Roman&quot;,serif; font-style:italic; }
    #westbund-book-guide .wb-canvas .wb-detail { font-family:&quot;Westbund Grotesque&quot;,Arial,sans-serif; font-weight:500; }
    #westbund-book-guide .wb-physical { height:76px; position:relative; color:light-dark(#707070,#aaa); }
    #westbund-book-guide .wb-book { position:absolute; top:15px; left:27.5%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:7px; white-space:nowrap; font-size:11px; }
    #westbund-book-guide .wb-book svg { width:20px; height:25px; }
    #westbund-book-guide .wb-flight { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:hidden; }
    #westbund-book-guide .wb-dock { position:absolute; inset:8px; pointer-events:none; z-index:2; }
    #westbund-book-guide .wb-console { position:absolute; bottom:0; left:0; pointer-events:auto; color-scheme:dark; }
    #westbund-book-guide[data-control-corner^=&quot;top&quot;] .wb-console { top:0; bottom:auto; }
    #westbund-book-guide[data-control-corner$=&quot;right&quot;] .wb-console { left:auto; right:0; }
    #westbund-book-guide .wb-console &gt; summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; width:max-content; background:#202124ed; color:#f7f7f7; border:0; border-radius:24px; padding:9px 14px; font-size:11px; line-height:16px; user-select:none; box-shadow:0 3px 12px #00000012; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
    #westbund-book-guide summary::-webkit-details-marker { display:none; }
    #westbund-book-guide .wb-console &gt; summary::before { content:&quot;&quot;; width:5px; height:5px; border-radius:50%; background:#a8bfff; }
    #westbund-book-guide .wb-console &gt; summary span { color:#b8bbc3; }
    #westbund-book-guide .wb-panel { position:absolute; bottom:calc(100% + 10px); left:0; width:264px; max-width:calc(100vw - 48px); padding:18px; background:#202124f5; color:#efeff2; border:0; border-radius:16px; box-shadow:0 12px 40px #00000022; backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); font-size:11px; line-height:1.5; }
    #westbund-book-guide[data-control-corner^=&quot;top&quot;] .wb-panel { top:calc(100% + 10px); bottom:auto; }
    #westbund-book-guide[data-control-corner$=&quot;right&quot;] .wb-panel { left:auto; right:0; }
    #westbund-book-guide .wb-panel button { font:inherit; color:#c2c4cc; background:transparent; border:0; border-radius:7px; padding:7px 10px; cursor:pointer; }
    #westbund-book-guide .wb-panel button:hover { color:#fff; background:#ffffff0c; }
    #westbund-book-guide .wb-panel button[aria-pressed=&quot;true&quot;] { background:#ffffff19; color:#fff; }
    #westbund-book-guide .wb-tabs { display:flex; gap:3px; padding:3px; background:#ffffff07; border-radius:10px; margin-bottom:16px; }
    #westbund-book-guide .wb-tabs button { flex:1; }
    #westbund-book-guide .wb-field { display:flex; align-items:center; justify-content:space-between; gap:14px; margin:12px 0; color:#b8bbc3; }
    #westbund-book-guide .wb-field select { font:inherit; max-width:148px; color:#efeff2; background:#202124; border:0; padding:5px 0 5px 7px; cursor:pointer; }
    #westbund-book-guide .wb-settings &gt; summary { list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; padding:11px 0; color:#d8dae0; }
    #westbund-book-guide .wb-settings &gt; summary::after { content:&quot;+&quot;; color:#9397a0; font-size:14px; }
    #westbund-book-guide .wb-settings[open] &gt; summary::after { content:&quot;−&quot;; }
    #westbund-book-guide .wb-placement { display:flex; gap:3px; }
    #westbund-book-guide .wb-placement button { font-family:Arial,sans-serif; font-size:17px; padding:2px 8px; }
    #westbund-book-guide .wb-range { display:block; margin:14px 0; color:#b8bbc3; }
    #westbund-book-guide .wb-range span { display:flex; justify-content:space-between; gap:8px; }
    #westbund-book-guide input[type=&quot;range&quot;] { width:100%; accent-color:#b2c7ff; margin:9px 0 0; height:3px; cursor:pointer; }
    #westbund-book-guide input[type=&quot;checkbox&quot;] { accent-color:#b2c7ff; }
    #westbund-book-guide .wb-check { display:flex; align-items:center; gap:7px; margin:10px 0 16px; color:#c4c6ce; }
    #westbund-book-guide .wb-person-controls { padding-top:2px; }
    #westbund-book-guide .wb-actions { display:flex; justify-content:space-between; align-items:center; margin:4px 0 10px; }
    #westbund-book-guide .wb-state { color:#a1a5af; font-size:11px; }
    #westbund-book-guide .wb-artwork-info { color:#a1a5af; font-size:11px; line-height:1.6; margin:6px 0 0; }
    #westbund-book-guide .wb-accessible { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); }
  &lt;/style&gt;
  &lt;div class=&quot;wb-stage&quot;&gt;
  &lt;svg class=&quot;wb-canvas&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 2880 540&quot; role=&quot;img&quot; aria-labelledby=&quot;wbg-title wbg-desc&quot;&gt;
    &lt;title id=&quot;wbg-title&quot;&gt;ARTIFACT Futures — from screen to journal&lt;/title&gt;
    &lt;desc id=&quot;wbg-desc&quot;&gt;Three adjoining 16:9 screens. Without visitors, images cycle through blue-and-white print dots. As visitors approach, the continuous title slows and the photographs resolve into colour. Each Issue 02 cover emerges from print dots and follows within the open space below. After three seconds stopped and facing the screen, the cover funnels toward the physical journal beneath the screens while the photographs hold still. Each visitor triggers once per visit.&lt;/desc&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;westbund-book-guide&quot;);
      const find = selector =&gt; root.querySelector(selector);
      const svg = find(&quot;.wb-canvas&quot;);
      const track = find(&quot;.wb-track&quot;);
      const stage = find(&quot;.wb-stage&quot;);
      const overlay = find(&quot;.wb-flight&quot;);
      const book = find(&quot;.wb-book&quot;);
      const play = find(&quot;[data-play]&quot;);
      const status = find(&quot;[data-status]&quot;);
      const detail = find(&quot;[data-detail]&quot;);
      const consolePanel = find(&quot;.wb-console&quot;);
      const panel = find(&quot;.wb-panel&quot;);
      const photo = find(&quot;.wb-photo&quot;);
      const slides = JSON.parse(find(&quot;[data-slides]&quot;).textContent);
      const titleWords = Array.from(root.querySelectorAll(&quot;#wbg-strip text&quot;));
      const titleCopies = Array.from(track.querySelectorAll(&quot;use&quot;));
      const reduced = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
      const namespace = &quot;http://www.w3.org/2000/svg&quot;;
      const views = { all:[0,2880], left:[0,960], middle:[960,960], right:[1920,960] };
      const coverWidth = 104;
      const coverHeight = 146.93;
      const coverY = 292;
      let cycleWidth = 2060;
      const clamp = (value, min = 0, max = 1) =&gt; Math.min(max, Math.max(min, value));
      const mix = (a, b, amount) =&gt; a + (b - a) * amount;
      const smooth = amount =&gt; { const t = clamp(amount); return t * t * (3 - 2 * t); };
      let mode = &quot;loop&quot;;
      let running = !reduced.matches;
      let view = &quot;all&quot;;
      let bookX = 792;
      let bookY = 650;
      let bookWidth = 32;
      let bookHeight = 46;
      let bookGlow = 0;
      let demoTime = 0;
      let position = 0;
      let speed = 96;
      let cycles = 0;
      let last = null;
      let frameId = 0;
      let lastStatus = &quot;&quot;;
      let destroyed = false;
      let photoIndex = 0;
      let photoProgress = 0;
      let photoTransition = null;
      let preparedMorph = null;
      let preparingMorph = false;
      let photoTempo = 9;
      let photoPresence = 0;
      let photoColumns = 160;
      let coverColumns = 32;
      // The original ARTIFACT Bayer matrix, luminance curve and ink/paper colours.
      const bayer = [0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,
        12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,
        3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,
        15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21];
      const photoPrint = printLayer(photo, &quot;photo&quot;, 960, 540);
      const morphSurface = element(&quot;foreignObject&quot;, {
        x:1920, y:0, width:960, height:540, hidden:&quot;&quot;, &quot;data-dot-morph&quot;:&quot;&quot;, &quot;aria-hidden&quot;:&quot;true&quot;
      }, photo.parentNode);
      const morphCanvas = document.createElement(&quot;canvas&quot;);
      morphCanvas.style.cssText = &quot;display:block;width:100%;height:100%;pointer-events:none&quot;;
      morphSurface.appendChild(morphCanvas);
      const morphContext = morphCanvas.getContext(&quot;2d&quot;);
      const slideTextures = slides.map(slide =&gt; loadPrintSource(slide.src));
      const coverTexture = loadPrintSource(find(&quot;#wbg-cover&quot;).getAttribute(&quot;href&quot;));

      function loadPrintSource(src) {
        const image = new Image();
        const source = { image, ready:false, cache:new Map() };
        image.onload = () =&gt; {
          if (destroyed || !root.isConnected) return;
          source.ready = true;
          refreshPrints();
        };
        image.onerror = () =&gt; { if (!destroyed) root.dataset.textureFallback = &quot;true&quot;; };
        image.src = src;
        return source;
      }

      function printTexture(source, columns, width, height) {
        if (!source.ready) return null;
        const rows = Math.round(columns * height / width);
        const key = `${columns}:${rows}`;
        if (source.cache.has(key)) return source.cache.get(key);
        const canvas = document.createElement(&quot;canvas&quot;);
        canvas.width = columns;
        canvas.height = rows;
        const context = canvas.getContext(&quot;2d&quot;, { willReadFrequently:true });
        if (!context) return null;
        const scale = Math.max(columns / source.image.width, rows / source.image.height);
        const w = source.image.width * scale;
        const h = source.image.height * scale;
        context.drawImage(source.image, (columns-w)/2, (rows-h)/2, w, h);
        const frame = context.getImageData(0, 0, columns, rows);
        const dots = new Uint8Array(columns*rows);
        for (let y=0; y&lt;rows; y++) {
          for (let x=0; x&lt;columns; x++) {
            const at = (y*columns+x)*4;
            const data = frame.data;
            const light = (.2126*data[at] + .7152*data[at+1] + .0722*data[at+2])/255;
            const ink = smooth((light-.08)/.84) &lt; (bayer[(y%8)*8+x%8]+.5)/64;
            dots[y*columns+x] = Number(ink);
            data[at] = ink ? 21 : 255;
            data[at+1] = ink ? 70 : 255;
            data[at+2] = ink ? 176 : 255;
            data[at+3] = 255;
          }
        }
        context.putImageData(frame, 0, 0);
        const result = { src:canvas.toDataURL(), columns, rows, dots };
        // Bound cached sizes when the preview is repeatedly resized.
        if (source.cache.size &gt;= 3) source.cache.delete(source.cache.keys().next().value);
        source.cache.set(key, result);
        return result;
      }

      function printLayer(original, name, width, height) {
        const holder = element(&quot;g&quot;, {}, original.parentNode);
        original.parentNode.insertBefore(holder, original);
        const clip = original.getAttribute(&quot;clip-path&quot;);
        if (clip) { holder.setAttribute(&quot;clip-path&quot;, clip); original.removeAttribute(&quot;clip-path&quot;); }
        holder.appendChild(original);
        const layer = element(&quot;svg&quot;, {
          x:original.getAttribute(&quot;x&quot;) || 0, y:original.getAttribute(&quot;y&quot;) || 0,
          width, height, viewBox:`0 0 ${width} ${height}`, preserveAspectRatio:&quot;none&quot;,
          &quot;aria-hidden&quot;:&quot;true&quot;, &quot;pointer-events&quot;:&quot;none&quot;, &quot;data-print&quot;:name
        }, holder);
        const defs = element(&quot;defs&quot;, {}, layer);
        function orderedMask(suffix, shift) {
          const id = `wbg-${name}-${suffix}`;
          const pattern = element(&quot;pattern&quot;, {
            id:`${id}-pattern`, patternUnits:&quot;userSpaceOnUse&quot;, width:48, height:48,
            viewBox:&quot;0 0 8 8&quot;, preserveAspectRatio:&quot;none&quot;
          }, defs);
          const cells = bayer.map((_,i) =&gt; ({
            rank:bayer[((Math.floor(i/8)+shift)%8)*8+(i%8+3)%8],
            node:element(&quot;rect&quot;, { x:i%8, y:Math.floor(i/8), width:1, height:1, fill:&quot;white&quot;, &quot;shape-rendering&quot;:&quot;crispEdges&quot; }, pattern)
          }));
          const mask = element(&quot;mask&quot;, { id, maskUnits:&quot;userSpaceOnUse&quot;, x:0, y:0, width, height, style:&quot;mask-type:alpha&quot; }, defs);
          element(&quot;rect&quot;, { width, height, fill:`url(#${id}-pattern)` }, mask);
          let previous = -1;
          return { pattern, id, set(amount) {
            const level = Math.round(clamp(amount)*128)/2;
            if (level === previous) return;
            previous = level;
            cells.forEach(({node,rank}) =&gt; node.setAttribute(&quot;opacity&quot;, String(clamp(level-rank))));
          } };
        }
        const inkMask = orderedMask(&quot;ink&quot;, 5);
        const texture = element(&quot;image&quot;, { width, height, preserveAspectRatio:&quot;none&quot;, mask:`url(#${inkMask.id})`, style:&quot;image-rendering:pixelated&quot; }, layer);
        const result = { layer, width, height,
          set(amount) {
            inkMask.set(amount);
            layer.setAttribute(&quot;data-ink&quot;, amount.toFixed(3));
          },
          source(source, columns) {
            const prepared = printTexture(source, columns, width, height);
            if (!prepared || texture.getAttribute(&quot;href&quot;) === prepared.src) return;
            texture.setAttribute(&quot;href&quot;, prepared.src);
            inkMask.pattern.setAttribute(&quot;width&quot;, String(width/prepared.columns*8));
            inkMask.pattern.setAttribute(&quot;height&quot;, String(height/prepared.rows*8));
            layer.setAttribute(&quot;data-ready&quot;, &quot;true&quot;);
          }
        };
        result.set(1);
        return result;
      }

      function refreshPrints() {
        if (destroyed) return;
        photoPrint.source(slideTextures[photoIndex], photoTransition?.columns ?? photoColumns);
        visitors.forEach(visitor =&gt; visitor.print.source(coverTexture, coverColumns));
      }

      function layoutTitle() {
        if (destroyed || !root.isConnected) return;
        const previousCycle = cycleWidth;
        const gap = 220;
        let cursor = 54;
        titleWords.forEach(word =&gt; {
          word.setAttribute(&quot;x&quot;, &quot;0&quot;);
          const bounds = word.getBBox();
          word.setAttribute(&quot;x&quot;, String(cursor - bounds.x));
          cursor += bounds.width + gap;
        });
        cycleWidth = cursor - 54;
        position = position / previousCycle * cycleWidth;
        titleCopies.forEach((copy,index) =&gt; copy.setAttribute(&quot;x&quot;, String(index * cycleWidth)));
        track.setAttribute(&quot;data-gap&quot;, String(gap));
        track.setAttribute(&quot;data-cycle-width&quot;, String(cycleWidth));
        const boxes = titleWords.map(word =&gt; word.getBBox());
        track.setAttribute(&quot;data-measured-gaps&quot;, JSON.stringify(boxes.map((box,index) =&gt; {
          const next = boxes[(index + 1) % boxes.length];
          return next.x + (index === boxes.length - 1 ? cycleWidth : 0) - box.x - box.width;
        })));
        track.setAttribute(&quot;transform&quot;, `translate(${-position} 0)`);
      }

      function updatePanelGeometry() {
        // In the inline preview, reserve extra height only while a tall panel is open.
        // This keeps all four dock positions inside the surface at narrow widths.
        const naturalHeight = stage.getBoundingClientRect().height + 96;
        const requiredHeight = consolePanel.open ? panel.getBoundingClientRect().height + 70 : 0;
        root.style.minHeight = `${Math.ceil(Math.max(naturalHeight, requiredHeight))}px`;
      }

      function updateImageSource() {
        const slide = slides[photoIndex];
        find(&quot;[data-image-number]&quot;).textContent = `${String(photoIndex + 1).padStart(2,&quot;0&quot;)} / 06`;
        find(&quot;[data-image-source]&quot;).textContent = slide.credit;
        photo.setAttribute(&quot;aria-label&quot;, slide.label);
        photo.setAttribute(&quot;data-slide&quot;, String(photoIndex + 1));

      async function prepareMorph() {

      function updateGeometry() {
        const [left, width] = views[view];
        const rect = svg.getBoundingClientRect();
        if (!rect.width) return;

      function safeCenter(x) {

      }

      function resetVisitor(visitor) {

        visitor.facing = false;

      function setVisitor(visitor, present, facing, x) {

          visitor.dwell = 0;
          visitor.revealTime = 0;

      function syncManual() {
        const count = Number(find(&quot;[data-count]&quot;).value);
        visitors.forEach(visitor =&gt; {
          const i = visitor.index;
          find(`[data-person-controls=&quot;${i}&quot;]`).hidden = i &gt;= count;

      function advanceDemo(dt) {
        demoTime += dt;

        setVisitor(visitors[1], demoTime &gt;= 5 &amp;&amp; demoTime &lt; 18, demoTime &gt;= 9,

      function startFlight(visitor) {
        visitor.phase = &quot;flying&quot;;
        visitor.flightTime = 0;
        visitor.originX = visitor.x;
        visitor.targetX = bookX;
        visitor.targetY = bookY - .55 * bookHeight;
        visitor.targetWidth = bookWidth;
        visitor.targetHeight = bookHeight;
